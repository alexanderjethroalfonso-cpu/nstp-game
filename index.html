<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tindahan Rush">
<meta name="application-name" content="Tindahan Rush">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#7b2ff7">
<title>TINDAHAN RUSH</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root{
  --u: min(1vh, 0.75vw);
  --pink:#ff2e88; --yellow:#ffd60a; --cyan:#00c2ff; --lime:#6bff3d; --orange:#ff6a00;
  --purple:#7b2ff7; --ink:#2b0a3d; --green:#00b84a; --red:#ff3b30; --blue:#2463ff;
  --font:"Arial Rounded MT Bold","Avenir Next","Trebuchet MS","Helvetica Neue",-apple-system,system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --ol: 0.07em 0.07em 0 var(--ink), -0.05em -0.05em 0 var(--ink), 0.07em -0.05em 0 var(--ink), -0.05em 0.07em 0 var(--ink), 0 0.14em 0 rgba(0,0,0,.3);
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
body{position:fixed;inset:0;background:var(--purple);font-family:var(--font);font-weight:900;color:#fff;line-height:1.1}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.e,.emo{font-family:var(--emoji);font-weight:400;text-shadow:none}

/* ---------- background ---------- */
#bg{position:fixed;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;
  background:repeating-conic-gradient(from 0deg,#8f3dff 0deg 9deg,#7b2ff7 9deg 18deg);
  animation:spin 22s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
#app{position:fixed;inset:0;z-index:1;overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 1.5*var(--u)) calc(var(--sar) + 2*var(--u)) calc(var(--sab) + 1.5*var(--u)) calc(var(--sal) + 2*var(--u));
  gap:calc(var(--u)*2.2)}
.screen.on{display:flex;animation:scrIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes scrIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* ---------- buttons ---------- */
.btn{min-height:80px;min-width:80px;border-radius:calc(var(--u)*3.2);font-size:calc(var(--u)*5.2);color:#fff;
  text-shadow:var(--ol);background:var(--bg,var(--orange));padding:.25em .8em;
  border:calc(var(--u)*.6) solid var(--ink);box-shadow:0 calc(var(--u)*1.1) 0 var(--ink), inset 0 -.25em 0 rgba(0,0,0,.18);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .08s}
.btn:active,.btn.press{transform:translateY(calc(var(--u)*.9)) scale(.96);box-shadow:0 calc(var(--u)*.2) 0 var(--ink), inset 0 -.25em 0 rgba(0,0,0,.18)}
.btn small{font-size:.48em;opacity:.95;margin-top:.15em}
.btn[disabled]{filter:grayscale(1) brightness(.8);opacity:.6}
.btn.big{font-size:calc(var(--u)*7);padding:.25em .9em}
.wig{animation:wig 2.2s ease-in-out infinite}
.wig:nth-child(2n){animation-delay:-1.1s}
.wig:nth-child(3n){animation-duration:2.6s}
@keyframes wig{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg) scale(1.02)}}
.row{display:flex;gap:calc(var(--u)*3);align-items:center;justify-content:center;flex-wrap:nowrap}
.ttl{max-width:calc(100vw - 2 * (var(--sar) + 96px));font-size:calc(var(--u)*7);text-shadow:var(--ol);text-align:center;letter-spacing:.02em}
.sub{font-size:calc(var(--u)*4);text-shadow:var(--ol);text-align:center}

/* ---------- mute ---------- */
#mute{position:fixed;z-index:60;top:calc(var(--sat) + 6px);right:calc(var(--sar) + 6px);width:80px;height:80px;border-radius:50%;
  background:var(--yellow);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:38px;display:flex;align-items:center;justify-content:center}
#mute:active{transform:translateY(3px)}

/* ---------- title ---------- */
.logo{display:flex;flex-wrap:wrap;justify-content:center;gap:0 calc(var(--u)*1.5);font-size:calc(var(--u)*13);text-shadow:var(--ol);line-height:.95;max-width:92vw}
.logo .w{display:flex}
.logo span{display:inline-block;animation:bounceL 1s ease-in-out infinite}
@keyframes bounceL{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12%) rotate(3deg)}}
.vs{font-size:calc(var(--u)*5);text-shadow:var(--ol);display:flex;align-items:center;gap:calc(var(--u)*2)}
.vs b{background:var(--yellow);color:var(--ink);text-shadow:none;border-radius:99px;padding:.05em .45em;border:3px solid var(--ink);font-size:.8em;transform:rotate(-6deg)}
.best{font-size:calc(var(--u)*3.3);background:rgba(0,0,0,.35);padding:.45em 1em;border-radius:99px;text-shadow:none}
.floaty{position:absolute;font-size:calc(var(--u)*9);animation:floaty 3s ease-in-out infinite;pointer-events:none;opacity:.9}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-25%) rotate(12deg)}}

/* ---------- tutorial ---------- */
.card{background:#fff;color:var(--ink);border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*5);box-shadow:0 calc(var(--u)*1.5) 0 var(--ink);
  width:min(86vw, calc(var(--u)*130));height:calc(var(--u)*60);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2);position:relative;overflow:hidden}
.card .txt{font-size:calc(var(--u)*5.4);text-align:center}
.pic{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3);font-size:calc(var(--u)*13);height:calc(var(--u)*36);position:relative}
.pic .arrow{font-size:.6em;color:var(--pink);animation:nudge .8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(25%)}}
.mini-bub{position:relative;background:#fff;border:4px solid var(--ink);border-radius:calc(var(--u)*2.5);font-size:.55em;padding:.05em .25em;margin-bottom:.1em}
.stackc{display:flex;flex-direction:column;align-items:center}
.tile{background:#fff6d6;border:4px solid var(--ink);border-radius:calc(var(--u)*3);padding:.05em .15em;position:relative;box-shadow:0 6px 0 var(--ink)}
.hand{position:absolute;font-size:.75em;pointer-events:none;animation:tapHand 1s ease-in-out infinite;z-index:5}
@keyframes tapHand{0%,100%{transform:translate(0,20%)}50%{transform:translate(0,-5%) scale(.9)}}
.pmini{display:flex;gap:calc(var(--u)*2)}
.pm{border:4px solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.2) calc(var(--u)*2);display:flex;flex-direction:column;align-items:center;color:#fff;text-shadow:var(--ol);font-size:calc(var(--u)*4.4);gap:calc(var(--u)*.8)}
.pm .e{font-size:calc(var(--u)*5.2)}
.dots{display:flex;gap:12px}
.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.4);border:3px solid var(--ink)}
.dots i.on{background:var(--yellow);transform:scale(1.3)}
.dragdemo{position:absolute;font-size:.6em;animation:dragDemo 2s ease-in-out infinite;z-index:3}
@keyframes dragDemo{0%{transform:translate(0,0)}15%{transform:translate(0,0) scale(1.15)}75%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:1}90%,100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* ---------- pick stall ---------- */
.stall{width:min(42vw,calc(var(--u)*62));height:calc(var(--u)*62);border-radius:calc(var(--u)*5);border:calc(var(--u)*.8) solid var(--ink);box-shadow:0 calc(var(--u)*1.5) 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);color:#fff;text-shadow:var(--ol);padding:calc(var(--u)*2)}
.stall .big{font-size:calc(var(--u)*17)}
.stall .nm{font-size:calc(var(--u)*5.6);text-align:center}
.stall .its{display:flex;gap:.25em;white-space:nowrap;font-size:calc(var(--u)*6.5);background:rgba(255,255,255,.85);border-radius:99px;padding:.1em .4em;border:3px solid var(--ink)}
.stall:active{transform:scale(.96)}

/* ---------- handoff ---------- */
.bigemo{font-size:calc(var(--u)*24);animation:wig 1.2s ease-in-out infinite}

/* ---------- price ---------- */
.dayhdr{max-width:calc(100vw - 2 * (var(--sar) + 96px));display:flex;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*6.5);text-shadow:var(--ol)}
.dayhdr .tag{background:var(--yellow);color:var(--ink);text-shadow:none;padding:.05em .5em;border-radius:99px;border:4px solid var(--ink);transform:rotate(-4deg)}
.icards{display:flex;gap:calc(var(--u)*2)}
.icard{width:calc(var(--u)*27);white-space:nowrap;background:#fff;color:var(--ink);border:calc(var(--u)*.6) solid var(--ink);border-radius:calc(var(--u)*3);display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*1) 0;position:relative;box-shadow:0 calc(var(--u)*.9) 0 var(--ink)}
.icard .e{font-size:calc(var(--u)*9)}
.icard .n{font-size:calc(var(--u)*3)}
.icard .l{font-size:calc(var(--u)*2.6);opacity:.7;font-weight:700}
.icard .pr{font-size:calc(var(--u)*3.6)}
.icard .k{font-size:calc(var(--u)*4);color:#fff;background:var(--green);border-radius:99px;padding:0 .4em;margin-top:.2em;text-shadow:var(--ol);transition:transform .2s}
.icard .k.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35) rotate(-5deg)}}
.ubos{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(80,80,80,.72);border-radius:inherit}
.ubos b{background:var(--red);color:#fff;font-size:calc(var(--u)*4.2);padding:.1em .4em;border:3px solid var(--ink);border-radius:8px;transform:rotate(-14deg);text-shadow:var(--ol)}
.chips{display:flex;gap:calc(var(--u)*1.5);flex-wrap:wrap;justify-content:center}
.chip{background:rgba(0,0,0,.4);border-radius:99px;padding:.3em .8em;font-size:calc(var(--u)*3.1);text-shadow:none;white-space:nowrap}
.chip.bad{background:var(--red)}
.chip.good{background:var(--green)}
.pbtns{display:flex;gap:calc(var(--u)*2.5)}
.pbtn{width:calc(var(--u)*34);min-height:80px;height:calc(var(--u)*22);font-size:calc(var(--u)*6.6)}
.pbtn .crowd{font-size:calc(var(--u)*4.6);font-family:var(--emoji);text-shadow:none;letter-spacing:-.1em}
.pbtn.sel{outline:calc(var(--u)*1) solid #fff;outline-offset:calc(var(--u)*.4);transform:scale(1.07) rotate(-1.5deg);animation:none}
.pbtn.sel::after{content:"✔";position:absolute;top:-.35em;right:-.3em;background:var(--lime);color:var(--ink);text-shadow:none;border:4px solid var(--ink);border-radius:50%;width:1.3em;height:1.3em;font-size:.6em;display:flex;align-items:center;justify-content:center}
.pbtn{position:relative}

/* ---------- rush ---------- */
#rush{padding:0;gap:0;justify-content:flex-start;background:linear-gradient(#55dcff 0%,#bdf4ff 62%,#ffd27a 62.2%,#ffbf52 100%)}
#rush.spot2{background:linear-gradient(#ff8ad8 0%,#ffd1a6 62%,#b6f36b 62.2%,#8fe04a 100%)}
#rush.spot2 .awning{--a1:#00a2ff}
.hud{width:100%;height:calc(max(88px, var(--u)*11) + var(--sat));padding:calc(var(--sat) + 4px) calc(var(--sar) + 96px) 4px calc(var(--sal) + 8px);display:flex;align-items:center;gap:calc(var(--u)*2);background:var(--ink);position:relative;z-index:5;flex:none}
.hud .hbtn{width:80px;height:80px;min-height:80px;min-width:80px;flex:none;font-size:34px;padding:0;border-radius:18px}
.hud .day{font-size:calc(var(--u)*4.4);white-space:nowrap}
.sky{flex:1;height:calc(var(--u)*6);min-height:34px;border-radius:99px;background:linear-gradient(90deg,#ffe66b,#ff9a3c 60%,#5b2a86);position:relative;border:3px solid #000;margin:0 calc(var(--u)*3)}
.sky .sun{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:calc(var(--u)*6.4);transition:left .25s linear}
.sky .moon{position:absolute;right:-.3em;top:50%;transform:translateY(-50%);font-size:calc(var(--u)*5)}
.sky.late{animation:lateGlow .5s ease-in-out infinite alternate}
@keyframes lateGlow{to{box-shadow:0 0 0 5px var(--yellow)}}
.money{font-size:calc(var(--u)*5.6);background:var(--green);border-radius:99px;padding:.05em .55em;border:3px solid #000;text-shadow:var(--ol);white-space:nowrap}
.money.bump{animation:bump .3s}
.stage{flex:1;width:100%;display:flex;flex-direction:column;position:relative;min-height:0}
.stage.lipat{animation:lipat 1.8s ease-in-out}
@keyframes lipat{0%{transform:none}40%{transform:translateX(-120%) rotate(-5deg)}40.1%{transform:translateX(120%) rotate(5deg)}100%{transform:none}}
.awning{--a1:#ff2e88;height:calc(var(--u)*8);flex:none;position:relative;background:repeating-linear-gradient(90deg,var(--a1) 0 calc(var(--u)*7),#fff calc(var(--u)*7) calc(var(--u)*14));border-bottom:4px solid var(--ink)}
.awning .sign{position:absolute;left:50%;top:40%;transform:translateX(-50%) rotate(-2deg);background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:12px;font-size:calc(var(--u)*3.6);padding:.15em .8em;white-space:nowrap;box-shadow:0 5px 0 var(--ink);z-index:2}
.street{flex:1;display:flex;align-items:stretch;padding:calc(var(--u)*4) calc(var(--u)*1) calc(var(--u)*1);gap:calc(var(--u)*1);min-height:0;position:relative}
.slot{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.cust{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--u)*.6);width:100%;animation:custIn .4s cubic-bezier(.3,1.7,.5,1);position:relative}
@keyframes custIn{from{transform:translateY(50%) scale(.4);opacity:0}}
.cust.happy{animation:hopOut .6s ease-in forwards}
@keyframes hopOut{30%{transform:translateY(-14%) scale(1.1)}100%{transform:translateY(-60%) scale(.6);opacity:0}}
.cust.sad{animation:sadOut .7s ease-in forwards}
@keyframes sadOut{30%{transform:rotate(-8deg)}100%{transform:translateY(60%) rotate(14deg);opacity:0}}
.cust.poke .face{animation:poke .35s}
@keyframes poke{40%{transform:scale(1.2) rotate(10deg)}}
.bubble{background:#fff;color:var(--ink);border:calc(var(--u)*.55) solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*.6) calc(var(--u)*1.2);position:relative;display:flex;flex-direction:column;align-items:center;max-width:100%;box-shadow:0 calc(var(--u)*.6) 0 rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;bottom:calc(var(--u)*-2.2);left:50%;margin-left:calc(var(--u)*-1.2);border:calc(var(--u)*1.2) solid transparent;border-top:calc(var(--u)*1.4) solid var(--ink)}
.bubble .want{font-size:calc(var(--u)*9);line-height:1.05;position:relative}
.bubble .want .x2{position:absolute;right:-.6em;top:-.2em;font-family:var(--font);font-weight:900;font-size:.32em;background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:0 .25em;color:var(--ink)}
.bubble .want .q{position:absolute;right:-.45em;top:-.25em;font-size:.45em;color:var(--pink);font-family:var(--font);font-weight:900;text-shadow:none}
.bubble .want .no{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9em}
.bubble .line{font-size:calc(var(--u)*2.35);text-align:center;line-height:1.1;font-weight:800}
.face{font-size:calc(var(--u)*13);line-height:1;position:relative;animation:bob .5s ease-in-out infinite alternate;transform-origin:50% 100%}
.cust:nth-child(odd) .face{animation-duration:.62s}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6%) rotate(3deg)}}
.suki .face::before{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 0 calc(var(--u)*.9) var(--yellow),0 0 calc(var(--u)*4) var(--yellow);z-index:-1}
.pat{width:72%;height:calc(var(--u)*1.7);min-height:8px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.pat i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:0 50%}
.ntag{font-size:calc(var(--u)*2.2);background:var(--ink);color:#fff;border-radius:calc(var(--u)*2);padding:.15em .6em;max-width:100%;text-align:center;line-height:1.1}
.counter{flex:none;height:calc(var(--u)*33);background:repeating-linear-gradient(90deg,#b5652e 0 calc(var(--u)*9),#a5561f calc(var(--u)*9) calc(var(--u)*18));border-top:calc(var(--u)*1.6) solid #6b3410;
  display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*2.5) calc(var(--sab) + var(--u)*2.5);position:relative}
.item{flex:1;min-height:80px;min-width:80px;background:#fff6d6;color:var(--ink);border:calc(var(--u)*.7) solid var(--ink);border-radius:calc(var(--u)*3.5);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  box-shadow:0 calc(var(--u)*1.2) 0 var(--ink);transition:transform .07s;touch-action:none}
.item .e{font-size:calc(var(--u)*13);line-height:1.05}
.item .n{font-size:calc(var(--u)*3.2)}
.item .p{font-size:calc(var(--u)*3);color:#fff;background:var(--green);border-radius:99px;padding:0 .5em;margin-top:.15em;text-shadow:var(--ol)}
.item.hit{transform:translateY(calc(var(--u)*1)) scale(.93);box-shadow:0 calc(var(--u)*.2) 0 var(--ink)}
.item.no{animation:shakeX .3s}
.item.dead{filter:grayscale(1);opacity:.55}
@keyframes shakeX{25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
.hint{position:absolute;font-size:calc(var(--u)*10);z-index:8;pointer-events:none;animation:tapHand .8s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
#rush .tint{position:absolute;inset:0;background:rgba(5,25,110,.5);opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:4}
#rush.raining .tint{opacity:1}
#rush.raining.light .tint{opacity:.45}
.combo{flex:none;white-space:nowrap;font-size:calc(var(--u)*4.4);text-shadow:var(--ol);background:var(--pink);border:4px solid var(--ink);border-radius:99px;padding:.05em .5em;transform:rotate(-6deg);pointer-events:none;transition:transform .15s;display:none}
.combo.on{display:block}
.combo.bump{transform:rotate(-6deg) scale(1.35)}
.overlay{position:absolute;inset:0;background:rgba(43,10,61,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);z-index:20}
.overlay.on{display:flex}

/* ---------- banners, pops ---------- */
#pops{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*5);text-shadow:var(--ol);white-space:nowrap;animation:popUp .9s ease-out forwards;color:#fff}
.pop.cash{color:var(--lime)}
.pop.awit{color:#ffd0e6;font-size:calc(var(--u)*5.5)}
.pop.small{font-size:calc(var(--u)*3.4)}
.pop.say{font-size:calc(var(--u)*3);background:#fff;color:var(--ink);text-shadow:none;padding:.3em .6em;border-radius:14px;border:3px solid var(--ink);animation-duration:1.4s}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.3)}20%{transform:translate(-50%,-70%) scale(1.25)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:calc(var(--u)*9.5);text-align:center;text-shadow:var(--ol);white-space:nowrap;animation:slam 1.6s cubic-bezier(.2,1.6,.4,1) forwards;
  background:var(--bc,var(--pink));border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*4);padding:.15em .6em;box-shadow:0 calc(var(--u)*1.5) 0 var(--ink)}
.banner small{display:block;font-size:.42em;margin-top:.15em}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(3) rotate(-10deg);opacity:0}15%{transform:translate(-50%,-50%) scale(.95) rotate(-3deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.05) rotate(-3deg)}85%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.8) rotate(-3deg);opacity:0}}

/* ============ announcer voice (built-in speech, works offline) ============ */
const Voice = (function(){
  const ss = window.speechSynthesis, U = window.SpeechSynthesisUtterance;
  let voice = null, busyUntil = 0, unlocked = false;
  function pickVoice(){
    try { const vs = ss.getVoices() || []; voice = vs.filter(v => /^fil|^tl/i.test(v.lang))[0] || vs.filter(v => /^en/i.test(v.lang))[0] || vs[0] || null; } catch (e) {}
  }
  if (ss) { pickVoice(); try { ss.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  function unlock(){ if (unlocked || !ss || !U) return; unlocked = true; try { const u = new U(' '); u.volume = 0; ss.speak(u); } catch (e) {} }
  ['pointerdown', 'touchend'].forEach(ev => document.addEventListener(ev, unlock, { passive:true }));
  return {
    say(txt, prio){
      if (!ss || !U || Snd.muted || SPEED > 1.5) return;
      try {
        const t = now();
        if (!prio && (ss.speaking || t < busyUntil)) return;
        if (ss.speaking || ss.pending) ss.cancel();
        const u = new U(txt); if (voice) u.voice = voice;
        u.rate = 1.2; u.pitch = 1.6; u.volume = 1;
        ss.speak(u); busyUntil = t + 900;
      } catch (e) {}
    },
    stop(){ try { if (ss) ss.cancel(); } catch (e) {} }
  };
})();

/* ============ FX: confetti, rain, popups, shake ============ */
const FX = (function(){
  const cv = $('#fx'), cx = cv.getContext('2d');
  let W = 0, H = 0, running = false, rain = 0, emoRate = 0, emoAcc = 0, emoSet = null;
  const parts = [], drops = [], emos = [], emoCache = {};
  const EMO_DEF = ['💸', '🔥', '💯', '✨', '🪙', '😂', '🤑'];
  function emoImg(e){
    if (emoCache[e]) return emoCache[e];
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    x.font = '50px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 32, 36);
    return (emoCache[e] = c);
  }
  const COLS = ['#ff2e88', '#ffd60a', '#6bff3d', '#00c2ff', '#ff6a00', '#ffffff', '#b06bff'];
  function resize(){ const dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  resize(); window.addEventListener('resize', resize);
  function kick(){ if (!running) { running = true; last = now(); requestAnimationFrame(loop); } }
  let last = 0;
  function loop(ts){
    const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    cx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 900 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt;
      if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life * 2);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r * 2)), p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
      cx.restore();
    }
    if (rain > 0) {
      const want = Math.floor(160 * rain);
      while (drops.length < want) drops.push({ x:rand(-50, W), y:rand(-H, 0), v:rand(900, 1400), l:rand(14, 30) });
      if (drops.length > want) drops.length = want;
      cx.strokeStyle = 'rgba(200,225,255,.75)'; cx.lineWidth = 2; cx.beginPath();
      for (const d of drops) { d.y += d.v * dt; d.x += d.v * 0.15 * dt; if (d.y > H) { d.y = rand(-60, -10); d.x = rand(-50, W); } cx.moveTo(d.x, d.y); cx.lineTo(d.x + d.l * 0.15, d.y + d.l); }
      cx.stroke();
    } else drops.length = 0;
    if (emoRate > 0) { emoAcc += emoRate * dt; while (emoAcc >= 1) { emoAcc--; emos.push({ x:rand(0, W), y:-40, vy:rand(140, 300), r:rand(-0.5, 0.5), vr:rand(-3, 3), s:rand(26, 54), e:pick(emoSet || EMO_DEF) }); } }
    for (let i = emos.length - 1; i >= 0; i--) {
      const m = emos[i]; m.y += m.vy * dt; m.r += m.vr * dt;
      if (m.y > H + 60) { emos.splice(i, 1); continue; }
      cx.save(); cx.translate(m.x, m.y); cx.rotate(m.r); cx.drawImage(emoImg(m.e), -m.s / 2, -m.s / 2, m.s, m.s); cx.restore();
    }
    if (parts.length || rain > 0 || emoRate > 0 || emos.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0, 0, W, H); }
  }
  return {
    confetti(x, y, n, power){
      power = power || 1;
      for (let i = 0; i < n; i++) parts.push({ x, y, vx:rand(-500, 500) * power, vy:rand(-900, -250) * power, r:rand(0, 6), vr:rand(-12, 12), w:rand(7, 13), h:rand(9, 16), c:pick(COLS), life:rand(1.2, 2.4) });
      kick();
    },
    shower(n){
      for (let i = 0; i < n; i++) parts.push({ x:rand(0, W), y:rand(-H * 0.6, -10), vx:rand(-80, 80), vy:rand(0, 200), r:rand(0, 6), vr:rand(-10, 10), w:rand(8, 14), h:rand(10, 18), c:pick(COLS), life:rand(2.5, 4) });
      kick();
    },
    setRain(v){ rain = v; if (v > 0) kick(); },
    setEmoji(rate, set){ emoRate = rate; emoSet = set || null; if (rate > 0) kick(); },
    slam(e){ $$('.slamE').forEach(m => m.remove()); const d = document.createElement('div'); d.className = 'slamE'; d.textContent = e; $('#pops').appendChild(d); setTimeout(() => d.remove(), 760); },
    pop(x, y, txt, cls, dur){
      const d = document.createElement('div'); d.className = 'pop ' + (cls || ''); d.innerHTML = txt;
      d.style.left = x + 'px'; d.style.top = y + 'px'; $('#pops').appendChild(d);
      setTimeout(() => d.remove(), dur || (cls && cls.indexOf('say') >= 0 ? 1400 : 950));
    },
    banner(html, color, dur){
      const d = document.createElement('div'); d.className = 'banner'; d.innerHTML = html;
      if (color) d.style.setProperty('--bc', color);
      if (dur) d.style.animationDuration = dur + 's';
      $('#pops').appendChild(d); setTimeout(() => d.remove(), (dur || 1.6) * 1000);
    },
    mega(txt){
      $$('.mega').forEach(m => m.remove());
      const d = document.createElement('div'); d.className = 'mega'; d.textContent = txt; $('#pops').appendChild(d); setTimeout(() => d.remove(), 1000);
    },
    shake(l){ const a = $('#app'); a.classList.remove('shake1', 'shake2', 'shake3'); void a.offsetWidth; a.classList.add('shake' + l); clearTimeout(a._st); a._st = setTimeout(() => a.classList.remove('shake' + l), 520); },
    center(el){ const r = el.getBoundingClientRect(); return { x:r.left + r.width / 2, y:r.top + r.height / 2 }; }
  };
})();

  // combo cooldown

function makeTokens(total){
  const D = [10, 20, 25, 50, 100, 200].filter(d => total / d <= 9)[0] || 500;
  const n = Math.floor(total / D), rem = total - n * D, out = [];
  for (let i = 0; i < n; i++) out.push(D);
  if (rem > 0) out.push(rem);
  return out;
}

  const cap = { puhunan:STOCK_FULL, ipon:Math.max(600, amt.ipon * 1.15), emergency:EMERGENCY_COST * 2 };
  ['puhunan', 'ipon', 'emergency'].forEach(k => {

function coinDown(e){
  const el = e.currentTarget; if (el.classList.contains('used')) return;
  e.preventDefault(); Snd.init();
  J.dragged = true; Store.set('tr_jarhint', true); $$('.jhand').forEach(h => h.remove());
  const d = { el, id:e.pointerId, sx:e.clientX, sy:e.clientY, over:null };
  try { el.setPointerCapture(e.pointerId); } catch (er) {}
  el.classList.remove('back'); el.classList.add('drag');
  el.style.transform = 'scale(1.2)';
  Snd.tap();
  const move = ev => {
    if (ev.pointerId !== d.id) return;
    const dx = ev.clientX - d.sx, dy = ev.clientY - d.sy;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.2) rotate(' + (dx * 0.05) + 'deg)';
    const j = jarAt(ev.clientX, ev.clientY);
    if (j !== d.over) { if (d.over) d.over.classList.remove('over'); if (j) { j.classList.add('over'); Snd.tick(3); } d.over = j; }
  };
  const up = ev => {
    if (ev.pointerId !== d.id) return;
    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
    if (d.over) d.over.classList.remove('over');
    const j = ev.type === 'pointercancel' ? null : jarAt(ev.clientX, ev.clientY);
    el.classList.remove('drag');
    if (j) dropCoin(el, j);
    else { el.classList.add('back'); el.style.transform = ''; Snd.bonk(); }
  };
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function jarAt(x, y){

}
function dropCoin(el, j){

    $('#recSlot').innerHTML = p.best.isNew ? '<span class="record">🎉 BAGONG RECORD! 🎉</span>' : '<span class="chip">🏆 Best: ' + peso(p.best.prev) + '</span>';
    rankFx(r);
  });
}
function renderVersus(){
  const [a, b] = G.players;
  const win = a.ipon === b.ipon ? -1 : (a.ipon > b.ipon ? 0 : 1);
  const pan = (p, i) => { const r = rankOf(p.ipon);
    return '<div class="vpan" id="vp' + i + '" style="--pc:' + p.stall.color + '"><div class="crown e">👑</div>' +
      '<div class="who"><span class="e">' + p.stall.icon + '</span> ' + p.stall.owner.toUpperCase() + '</div>' +
      '<div class="sub" style="font-size:calc(var(--u)*3)">🐷 IPON</div><div class="ip" data-to="' + p.ipon + '">₱0</div>' +
      '<div class="rk"><span class="e">' + r.e + '</span> ' + r.name + '</div>' +
      '<div class="mini"><span class="e">🛒</span> ' + p.sales + ' &nbsp; <span class="e">🔥</span> x' + p.bestCombo + ' &nbsp; <span class="e">😩</span> ' + p.lost + '</div>' +
      (p.best.isNew ? '<span class="record" style="font-size:calc(var(--u)*2.8)">BAGONG RECORD!</span>' : '') + '</div>'; };
  $('#versus').innerHTML =
    '<div class="ttl">SINO ANG IPON QUEEN?</div>' +
    '<div class="vsrow">' + pan(a, 0) + '<div class="vmid">VS</div>' + pan(b, 1) + '</div>' +
    '<div class="sub" id="vsMsg" style="min-height:1.2em"></div>' +
    '<div class="row"><button class="btn big wig" data-a="again" style="--bg:var(--green)">🔁 REMATCH</button><button class="btn big wig" data-a="home" style="--bg:var(--cyan)">🏠 HOME</button></div>';
  show('versus');
  Snd.drumroll(1.5);
  $$('#versus .ip').forEach(el => countUp(el, +el.getAttribute('data-to'), 1500));
  setTimeout(() => {
    if (win < 0) { $('#vsMsg').textContent = 'TABLA! Pareho kayong reyna! 👑👑'; Snd.airhorn(); FX.shower(200); return; }
    $('#vp' + win).classList.add('win');
    $('#vsMsg').innerHTML = '🎉 PANALO SI ' + G.players[win].stall.owner.toUpperCase() + '! 🎉';
    Snd.airhorn(); FX.shower(220); FX.shake(3);
    const pt = FX.center($('#vp' + win)); FX.confetti(pt.x, pt.y, 120, 1.3);
  }, 1650);
}
ACT.again = () => {
  if (G.mode === '2p') { setupGame(['kriste', 'helen']); renderHandoff(true); }
  else { const id = G.players[0].stall.id; setupGame([id]); renderPrice(); }
};

(function makeIcon(){

    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#ff2e88'); g.addColorStop(1, '#7b2ff7');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);

    x.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.fillText('🏪', 90, 76);
    x.font = 'bold 34px "Arial Rounded MT Bold",Arial,sans-serif'; x.lineWidth = 7; x.strokeStyle = '#2b0a3d'; x.strokeText('RUSH', 90, 148); x.fillStyle = '#ffd60a'; x.fillText('RUSH', 90, 148);
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) {}
})();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
window.__TR = { G, get R(){ return R; }, Store };   // handy for testing
renderTitle();
})();
